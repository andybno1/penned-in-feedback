name: Feature request
description: Suggest an idea for Penned In, such as a new pen design or support for another mod's animals.
title: "[Idea]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! Every idea is read, though not all of them can be added.

  - type: dropdown
    id: type
    attributes:
      label: What kind of idea is it?
      options:
        - Support for another mod's animals
        - A new pen design
        - A new module, perk or feature
        - A change to something that already exists
        - Something else
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: Describe your idea
      description: What would you like to see, and how would it work in game?
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why would it be useful?
      description: What problem does it solve, or what would it make better?

  - type: input
    id: mod
    attributes:
      label: Mod or animal involved
      description: If your idea is about another mod's animals, name the mod and the animals (a CurseForge link helps).
      placeholder: "Naturalist - deer, bears"

  - type: dropdown
    id: minecraft
    attributes:
      label: Which Minecraft version do you play on?
      multiple: true
      options:
        - 1.20.1 (Forge)
        - 1.21.1 (NeoForge)
        - 26.1.2 (NeoForge)

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Sketches, screenshots or examples from other mods are welcome. Drag them into this box.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I've checked the open issues and this hasn't already been suggested.
          required: true
